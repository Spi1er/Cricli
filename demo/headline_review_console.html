<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Headline Review Console</title>
  <style>
    :root {
      --bg: #f6f5ef;
      --panel: #ffffff;
      --panel-soft: #f9faf5;
      --ink: #18212f;
      --muted: #687487;
      --line: #d9decc;
      --teal: #12756d;
      --teal-soft: #dff1ed;
      --blue: #315fba;
      --gold: #b7791f;
      --rose: #be3a51;
      --shadow: 0 10px 30px rgba(16, 24, 40, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    button, input, select { font: inherit; }
    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
    }
    .sidebar {
      border-right: 1px solid var(--line);
      background: #fcfcf7;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 100vh;
      position: sticky;
      top: 0;
    }
    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand-title {
      font-size: 19px;
      font-weight: 760;
      line-height: 1.1;
    }
    .brand-pill {
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 5px 8px;
      border-radius: 7px;
      font-size: 12px;
      white-space: nowrap;
    }
    .field-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
      text-transform: uppercase;
      margin: 0 0 -6px;
    }
    .search,
    .select-control {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      padding: 11px 12px;
      outline: none;
    }
    .select-control {
      cursor: pointer;
      min-height: 44px;
    }
    .search:focus,
    .select-control:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--teal-soft);
    }
    .mini-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .mini-stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 9px;
    }
    .mini-stat b { display: block; font-size: 18px; }
    .mini-stat span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .scenario-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
      padding: 10px;
    }
    .scenario-heading {
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
      margin: 0 0 8px;
      text-transform: uppercase;
    }
    .scenario-help {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }
    .current-article-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 11px;
    }
    .article-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .seed { color: var(--muted); font-size: 12px; }
    .category {
      color: var(--teal);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .article-snippet {
      color: #394456;
      font-size: 13px;
      line-height: 1.35;
      margin: 0;
    }
    main {
      min-width: 0;
      padding: 22px clamp(18px, 3vw, 42px) 42px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }
    .page-title {
      font-size: clamp(25px, 3vw, 38px);
      line-height: 1.04;
      margin: 0;
      max-width: 860px;
    }
    .scenario-banner {
      border: 1px solid #c7d2fe;
      border-left: 5px solid var(--blue);
      border-radius: 8px;
      background: #f4f7ff;
      padding: 12px 14px;
      margin-bottom: 16px;
      display: none;
    }
    .scenario-banner b {
      display: block;
      margin-bottom: 4px;
    }
    .scenario-banner span {
      color: #44516a;
      line-height: 1.45;
    }
    .objective-tabs {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0;
    }
    .tab {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 9px 12px;
      cursor: pointer;
      color: #2b3444;
      font-weight: 650;
    }
    .tab.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }
    .article-context {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 17px 0;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 18px;
    }
    .summary-text {
      font-size: 16px;
      line-height: 1.55;
      margin: 7px 0 0;
      color: #323d4d;
    }
    .context-meta {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      align-content: start;
    }
    .metric-chip {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
      padding: 10px 11px;
    }
    .metric-chip span { color: var(--muted); font-size: 12px; display: block; }
    .metric-chip b { display: block; margin-top: 3px; font-size: 18px; }
    .recommendation {
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 5px solid var(--teal);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 18px;
      margin-bottom: 18px;
    }
    .section-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
      text-transform: uppercase;
      margin: 0 0 8px;
    }
    .recommended-title {
      margin: 0;
      font-size: clamp(23px, 3vw, 34px);
      line-height: 1.12;
    }
    .reason {
      margin: 12px 0 0;
      line-height: 1.48;
      color: #3b4657;
    }
    .score-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }
    .score-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fbfcf9;
      min-width: 0;
    }
    .score-box-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }
    .bar {
      height: 7px;
      background: #e4e8dd;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill { height: 100%; background: var(--teal); border-radius: 999px; width: 0%; }
    .bar-fill.risk { background: var(--blue); }
    .bar-fill.audience { background: var(--gold); }
    .bar-fill.objective { background: var(--rose); }
    .bar-fill.support { background: var(--rose); }
    .option-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }
    .option-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 14px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .option-card.recommended {
      border-color: var(--teal);
      box-shadow: 0 0 0 2px var(--teal-soft);
    }
    .option-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .option-label {
      font-size: 13px;
      font-weight: 760;
      color: var(--ink);
    }
    .option-source {
      font-size: 11px;
      color: var(--muted);
      text-align: right;
      line-height: 1.3;
      max-width: 140px;
    }
    .headline {
      font-size: 18px;
      line-height: 1.25;
      font-weight: 720;
      margin: 0;
    }
    .decision-note {
      margin: 0;
      color: #465266;
      font-size: 13px;
      line-height: 1.42;
      border-left: 3px solid var(--line);
      padding-left: 10px;
    }
    .option-card.recommended .decision-note { border-left-color: var(--teal); }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: auto;
    }
    .tag {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 4px 7px;
      color: var(--muted);
      font-size: 11px;
      background: #fbfcf9;
    }
    .tag.rec { color: var(--teal); border-color: #9dd1c8; background: var(--teal-soft); }
    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 24px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.55);
    }
    @media (max-width: 920px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { position: relative; min-height: 0; border-right: 0; border-bottom: 1px solid var(--line); }
      .article-context { grid-template-columns: 1fr; }
      .score-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      main { padding: 18px 14px 32px; }
      .score-grid { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .mini-stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-row">
        <div class="brand-title">Headline Review Console</div>
        <div class="brand-pill">Local demo</div>
      </div>
      <label class="field-label" for="articleSelect">Select article or headline</label>
      <select id="articleSelect" class="select-control"></select>
      <input id="search" class="search" type="search" placeholder="Filter article cards">
      <div class="mini-stats">
        <div class="mini-stat"><b id="statArticles">0</b><span>articles</span></div>
        <div class="mini-stat"><b id="statObjectives">0</b><span>objectives</span></div>
        <div class="mini-stat"><b id="statRows">0</b><span>visible rows</span></div>

      <div class="scenario-panel">

        <select id="scenarioSelect" class="select-control"></select>

      </div>
      <div id="currentArticleCard" class="current-article-card"></div>
    </aside>
    <main>
      <div class="topbar">
        <h1 class="page-title" id="pageTitle">Headline recommendation</h1>

      <div id="scenarioBanner" class="scenario-banner"></div>
      <div id="objectiveTabs" class="objective-tabs"></div>
      <section class="article-context">
        <div>
          <p class="section-label" id="articleMeta">Article</p>
          <p class="summary-text" id="summaryText"></p>
        </div>
        <div class="context-meta">
          <div class="metric-chip"><span>Internal candidates</span><b id="candidatePool">0</b></div>
          <div class="metric-chip"><span>Generator sources</span><b id="sourcePool">0</b></div>
        </div>
      </section>
      <section class="recommendation">
        <p class="section-label">Recommended headline</p>
        <h2 class="recommended-title" id="recommendedTitle"></h2>
        <p class="reason" id="recommendedReason"></p>
        <div id="recommendedScores" class="score-grid"></div>
      </section>
      <p class="section-label">Visible decision set</p>
      <section id="optionGrid" class="option-grid"></section>
    </main>
  </div>

      const recommended = getRecommended(obj);
      if (!article || !obj) return;
      const scenario = getCurrentScenario();

      byId("pageTitle").textContent = text(obj.objective_name, "Headline") + " recommendation";
      const banner = byId("scenarioBanner");
      if (scenario) {
        banner.style.display = "block";
        banner.innerHTML = "";
        const title = document.createElement("b");
        title.textContent = scenario.label;
        const note = document.createElement("span");
        note.textContent = scenario.takeaway;
        banner.append(title, note);
      } else {
        banner.style.display = "none";
        banner.innerHTML = "";
      }
      byId("articleMeta").textContent = text(article.category, "Article") + " article #" + article.seed_id;
      byId("summaryText").textContent = text(article.summary, "");
      byId("candidatePool").textContent = text(obj.hidden_candidate_pool_size, "0");
      byId("sourcePool").textContent = text(obj.hidden_candidate_source_count, "0");
      byId("recommendedTitle").textContent = recommended ? text(recommended.headline, "") : "";
      byId("recommendedReason").textContent = recommended ? text(recommended.decision_explanation, recommended.recommendation_summary || "") : "";
      renderScoreGrid(byId("recommendedScores"), recommended);

      const grid = byId("optionGrid");
      grid.innerHTML = "";
      (obj.options || []).forEach(option => grid.appendChild(renderOption(option)));
    }

    function render() {
      renderStats();
      renderArticleSelect();
      renderScenarios();
      renderTabs();
      renderCurrentArticleCard();
      renderMain();
    }

    byId("articleSelect").addEventListener("change", event => {
      const seedId = Number(event.target.value);
      if (Number.isNaN(seedId)) return;
      state.seedId = seedId;
      render();
    });

    byId("scenarioSelect").addEventListener("change", event => {
      const scenario = SCENARIOS[Number(event.target.value)];
      applyScenario(scenario);
    });

    byId("search").addEventListener("input", event => {
      state.query = event.target.value;
      render();
    });

    render();
  </script>
</body>
</html>
